[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-days"
version = "0.1.0"
description = "芝コース何日目かを計算しKeibaAIのDBへ保存します"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Kubo-Tech"},
]
keywords = ["keiba", "horse racing", "course", "days"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # pandas 3.0はpy.typedを同梱しておりpandas-stubsより優先されるため、
    # mypyの判定結果がKeibaAI本体（pandas 2.3系）とずれる。3.0を除外する
    "pandas>=2.0.0,<3.0.0",
    "keiba-data-interface>=1.0.0",
    "db-client>=0.1.0",
]

[project.optional-dependencies]
scripts = [
    "tqdm>=4.60.0",
]
dev = [
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    # 静的解析の結果を左右するため、mypyと型情報のバージョンは固定する。
    # ruffはlibrary-workflowのci.ymlで集中管理しているためここには書かない。
    "mypy==1.17.1",
    # pandas由来の型エラーを検出するために必須。無いとCIがローカルより甘くなる
    "pandas-stubs==2.3.2.250827",
    # pandas-stubsが引くnumpyのバージョンで型が変わるため、版を固定する
    "numpy==1.26.4",
]

[project.urls]
Homepage = "https://github.com/KeibaAI-developer/course-days"
Documentation = "https://github.com/KeibaAI-developer/course-days/blob/main/README.md"
Repository = "https://github.com/KeibaAI-developer/course-days"
Issues = "https://github.com/KeibaAI-developer/course-days/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["course_days*"]

[tool.setuptools.package-data]
"course_days" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

# DOCルール（pydoclint相当）がpreview扱いのため有効化する。
# darglintのDAR401/DAR202/DAR301/DAR302を置き換えている。
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D", "I", "DOC"]
ignore = [
    "E203",   # `:` の前のスペース（Black互換）
    "D105",   # マジックメソッドのdocstring
    "D107",   # `__init__` のdocstring
    "D403",   # docstring先頭の大文字化（日本語docstringのため不要）
    "D415",   # docstring末尾のピリオド（日本語docstringのため不要）
    "DOC201", # Returns未記載（自明な場合は省略可）
    "DOC502", # Raisesに実際には送出しない例外を記載
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# 標準ライブラリの `test` パッケージと同名のため、サードパーティ扱いにさせない
extra-standard-library = ["test"]

[tool.black]
line-length = 100
target-version = ["py312", "py313"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = false
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_optional = true
strict_equality = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
disable_error_code = ["attr-defined", "import-untyped"]

[[tool.mypy.overrides]]
module = "test.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=course_days",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: 単体テスト",
    "integration: 結合テスト",
    "slow: 実行に時間がかかるテスト",
]

[tool.coverage.run]
source = ["course_days"]
omit = [
    "*/test/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
